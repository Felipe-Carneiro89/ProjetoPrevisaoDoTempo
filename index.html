<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Felipe Carneiro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="content-weather-daily">
        <nav class="navbar-container">
          <img src="/images/logo.png" alt="Clima Hoje Logo" />
          <input
            class="custons-input"
            type="text"
            name="city"
            id="city"
            placeholder="Search for cities"
          />
        </nav>
        <div class="showcase-container">
          <div class="showcase-container-text">
            <h2>London</h2>
            <p>Chance de chuva 0%</p>
            <h2>9º</h2>
          </div>
          <img src="/images/sun clouds.png" alt="Photo Sun between clouds" />
        </div>
      </div>
      <div class="content-weather-week"></div>
    </div>
  </body>
</html>
